<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Construindo uma tabela</title>
</head>
<body>
    <h1>Criando a primeira tabela</h1>
    <!--
        Hirarquia das Tabelas
        <table>: onde iremos fazer nossa tabela (semântica)
        Table Row <tr>: linha da tabela
        Table Header <th>: cabeçalho da tabela
        Table Data <td>: dado da tabela
    -->
    <table>
        <tr class="topo">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td>D2</td>
        </tr>
        <tr>
            <td class="destaque">A3</td>
            <td>B3</td>
            <td>C3</td>
            <td>D3</td>
        </tr>
        <tr>
            <td class="cor">A4</td>
            <td>B4</td>
            <td>C4</td>
            <td>D4</td>
        </tr>
    </table>
    <div>
        <a href="./tabela02.html">Próxima tabela</a>
    </div>
</body>
</html>
