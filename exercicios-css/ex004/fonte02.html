<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url(./fonts/Filxgirl.TTF) format(truetype);
            font-weight: normal;
            font-style: normal;
        }

        /*
        Tipoa de format()
        - opentype (otf)
        - truetype (ttf)
        - embedded-opentype
        - truetype-aat (Apple Advanced Typography)
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        h1{
            font-family: 'Love', Times, serif;
            font-size: 3.5em;
            font-weight: normal;
            line-height: 0.5;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores excepturi maxime minus facilis. Rerum qui necessitatibus dolorem accusamus repellendus optio aliquid alias quis, voluptatem voluptatibus unde in praesentium omnis vero.</p>
</body>
</html>
