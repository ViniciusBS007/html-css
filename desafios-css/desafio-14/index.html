<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Desafio 14: Criando uma tabela completa com semântica (scope)</title>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2" class="cabecalho" scope="col">Área</th>
            <th rowspan="2" class="cabecalho" scope="col">Disciplinas</th>
            <th colspan="2" class="cabecalho" scope="colgroup">Notas</th>
            <th rowspan="2" class="cabecalho" scope="col">Média</th>
        </tr>
        <tr>
            <th class="cabecalho" scope="col">Nota 1</th>
            <th class="cabecalho" scope="col">Nota 2</th>
        </tr>
        <tr>
            <th rowspan="5" scope="rowgroup">Exatas</th>
        </tr>
        <tr>
            <td class="centralizando">Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="centralizando">Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="centralizando">Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="centralizando">Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="4" id="medexata" scope="row">Média de Exatas</th>
            <th class="cabecalho" scope="row">0.0</th>
        </tr>
        <tr>
            <th rowspan="3" scope="rowgroup">Humanas</th>
        </tr>
        <tr>
            <td class="centralizando">História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="centralizando">Geográfia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="4" id="medhum" scope="row">Média de Humanas</th>
            <th class="cabecalho" scope="row">0.0</th>
        </tr>
    </table>
</body>
</html>
