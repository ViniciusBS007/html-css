<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Ol</title>
    <style>
        /*Configurações Gerais*/ /*OBS: Se quiser, pode colocar "@media all" para as configurações gerais.*/
    *{
        padding: 0px;
        margin: 0px;
        font-family: Arial, Helvetica, sans-serif;
    }

    html, body{
        background-color:#233eff;
        height: 100vh;
        width: 100vw;
        background-size: contain;
        background-repeat: no-repeat;
    }

    h1{
        color: rgb(247, 247, 250);
        text-shadow: 2px 2px 0px rgb(7, 7, 157);
        padding: 10px;
    }
            /*Configurações de Portrait*/
    @media screen and (orientation: portrait){
        body{
    background-image: url(./imagens/cev-portrait.jpg);
        }
    }
            /*Configurações de Landscape*/
    @media screen and (orientation: landscape){
        body{
    background-image: url(./imagens/cev-landscape.jpg);
    background-position: left bottom;
        }
    }
    </style>
</head>
<body>
    <h1>Mude a orientação da tela</h1>
</body>
</html>
