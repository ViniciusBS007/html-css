<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais tags de Input</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="./cadastro.php" method="post">
        <fieldset>
            <legend>Coloração</legend>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor">
        </fieldset>
        <fieldset>
            <legend>Satisfação</legend>
            <label for="inivel">Nível de Satisfação: </label>
            <input type="range" name="nivel" id="inivel" min="1" max="5">
        </fieldset>
        <fieldset>
            <legend>Arquivo/Foto</legend>
            <label for="ifoto">Foto do perfil: </label>
            <input type="file" name="foto" id="ifoto">
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
